# Docker Compose fajl za lokalni Data Engineering stack
# Sadrži:
# - PostgreSQL bazu za F1 podatke
# - PostgreSQL bazu za Airflow metadata
# - Airflow (CeleryExecutor: webserver, scheduler, worker, triggerer)
# - Redis
# - Kafka + Zookeeper
# - pgAdmin za rad sa bazom
# - Kafka UI za pregled topic-a

# ------------------------------------------------
# ZAJEDNIČKA AIRFLOW KONFIGURACIJA (anchor)
# Ovo je deo iz zvaničnog Airflow compose-a
# ------------------------------------------------
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.2

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres_airflow/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
    - ./files:/opt/airflow/files
    - ./output_csv:/opt/airflow/output_csv

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on: &airflow-common-depends-on
    redis:
      condition: service_started
    postgres_airflow:
      condition: service_started


services:

  # ------------------------------------------------
  # PostgreSQL baza gde cuvamo F1 podatke
  # kad se logujes na pgadmin 
  # postgres_formula naziv servisa
  #
  # ------------------------------------------------
  postgres_formula:
    image: postgres:15
    container_name: formula_one_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: formula_one_db

    ports:
      - "5432:5432"

    volumes:
      # volume cuva podatke tako da baza ostaje i posle restart-a
      - postgres_formula_data:/var/lib/postgresql/data

      # init.sql se pokrece SAMO prvi put kada se baza kreira
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

    restart: always


  # ------------------------------------------------
  # PostgreSQL baza za Airflow metadata
  # (Airflow ovde cuva DAG run-ove, task status itd.)
  # ------------------------------------------------
  postgres_airflow:
    image: postgres:13
    container_name: airflow_postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data

    ports:
      - "5433:5432"

    restart: always


  # ------------------------------------------------
  # Redis - koristi ga Airflow CeleryExecutor
  # ------------------------------------------------
  redis:
    image: redis:7.2-bookworm
    container_name: airflow_redis

    ports:
      - "6379:6379"

    restart: always


  # ------------------------------------------------
  # Airflow inicijalizacija baze
  # Pokrece se samo prvi put
  # Kreira Airflow tabele i admin korisnika
  # ------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init

    command: >
      bash -c "airflow db migrate &&
      airflow users create --username airflow --password airflow
      --firstname Admin --lastname User
      --role Admin --email admin@example.com"

    restart: "no"


  # ------------------------------------------------
  # Airflow Webserver
  # Ovde se otvara Airflow UI
  # ------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver

    command: webserver

    ports:
      - "8080:8080"

    restart: always

    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully


  # ------------------------------------------------
  # Airflow Scheduler
  # On pokrece taskove iz DAG-ova
  # ------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler

    command: scheduler

    restart: always

    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully


  # ------------------------------------------------
  # Airflow Worker
  # Izvrsava taskove kada koristimo CeleryExecutor
  # ------------------------------------------------
  airflow-worker:
    <<: *airflow-common
    container_name: airflow_worker

    command: celery worker

    restart: always


  # ------------------------------------------------
  # Airflow Triggerer
  # Potreban za async taskove
  # ------------------------------------------------
  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow_triggerer

    command: triggerer

    restart: always


  # ------------------------------------------------
  # pgAdmin - GUI alat za PostgreSQL
  # ------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    restart: always


  # ------------------------------------------------
  # Zookeeper (Kafka dependency)
  # ------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.3
    container_name: zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181


  # ------------------------------------------------
  # Kafka Broker
  # ------------------------------------------------
  kafka1:
    image: confluentinc/cp-kafka:7.3.3
    container_name: kafka1

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    depends_on:
      - zookeeper


  # ------------------------------------------------
  # Kafka UI
  # Pregled topic-a i poruka
  # ------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka_ui

    ports:
      - "8085:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092

    depends_on:
      - kafka1


# ------------------------------------------------
# Docker volumes
# cuvaju podatke i kada se container restartuje
# ------------------------------------------------
volumes:

  postgres_formula_data:
  postgres_airflow_data:
  pgadmin_data: